# ======================================================
# URL CONFIGURATION
# ======================================================
[URL]
base_url = https://www.zenclass.in/
login_url = https://www.zenclass.in/login/


# ======================================================
# LOGIN CREDENTIALS
# ======================================================
[LOGIN CREDENTIALS]

# Valid credentials (from environment variables)
valid_email    = ${ZEN_USERNAME}
valid_password = ${ZEN_PASSWORD}

# Dummy credentials (used for field validation tests)
dummy_email    = testuser@example.com
dummy_password = TestPass@123

# Invalid credentials (used for negative testing)
invalid_email   = invalid_user@guvi.com
invalid_password = WrongPass@999


# ======================================================
# DEFAULT TEST SETTINGS
# ======================================================
[DEFAULT]

# Browser to run tests on
browser = edge

# Used for testing whitespace input scenarios
blank_spaces = "     "

# Explicit wait timeout (in seconds)
explicit_wait = 10

# Page load wait (simple sleep fallback)
page_load_wait = 2